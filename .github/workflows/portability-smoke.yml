name: portability-smoke

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portability-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar pytest
        run: python -m pip install pytest
      - name: Tests de portabilidad y contrato (lista acotada)
        run: >
          python -m pytest -q
          tools/tests/test_v013_portability_smoke.py
          tools/tests/test_v013_portability_audit.py
          tools/tests/test_v013_ci_workflow.py
          tools/tests/test_v013_conformance_smoke.py
          tools/tests/test_skill_contract.py
          tools/harmessi_bench/tests
          tools/providers/tests/test_conformance.py
          tools/datasources/tests/test_conformance.py
          tools/dsimpact/tests/test_git_source.py
